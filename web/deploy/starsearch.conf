# star-search website vhost
# Public URL: https://starsearch.abacusai.cloud -> server_name starsearch.vm.internal
# Symlinked: /etc/nginx/conf.d/starsearch.conf -> this file
# When starsearch.online is routed to this VM (Cloud Settings -> Custom Domains),
# add it to server_name; its Host header arrives unchanged.
# Public traffic carries X-Original-Host; fall back to $host for direct/local requests
# (an empty Host makes Next.js answer 400). Variable name is prefixed to stay unique.
map $http_x_original_host $starsearch_upstream_host {
    ""      $host;
    default $http_x_original_host;
}

server {
    listen 80;
    server_name starsearch.vm.internal starsearch.online;

    client_max_body_size 1m;

    # Browsers revalidate each load (cheap 304s); CDN edge caches at most 60 s.
    add_header Cache-Control "max-age=0, s-maxage=60" always;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $starsearch_upstream_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        # Next.js sets its own Cache-Control; nginx's add_header above is authoritative.
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Frame-Options;
    }
}
